openapi: 3.1.0

info:
  title: API Inventaris Barang
  description: RESTful API untuk mengelola produk dan kategori
  version: 1.0.0

servers:
  - url: http://localhost/PBO-Teori-P14/inventaris-api/public
    description: Local Development (Laragon)

tags:
  - name: Products
    description: CRUD produk
  - name: Categories
    description: CRUD kategori

paths:
  /api/v1/products:
    get:
      tags: [Products]
      summary: Mengambil seluruh produk
      description: Mengambil daftar produk, dapat dicari berdasarkan nama dan difilter berdasarkan kategori
      parameters:
        - name: search
          in: query
          required: false
          description: Kata kunci pencarian pada nama produk
          schema:
            type: string
          example: Laptop
        - name: category_id
          in: query
          required: false
          description: Filter produk berdasarkan ID kategori
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: Daftar produk berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Products]
      summary: Menambahkan produk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produk berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Products]
      summary: Mengambil detail produk
      responses:
        '200':
          description: Detail produk ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Memperbarui produk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Produk berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Products]
      summary: Menghapus produk
      responses:
        '204':
          description: Produk berhasil dihapus
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Mengambil seluruh kategori
      responses:
        '200':
          description: Daftar kategori berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
    post:
      tags: [Categories]
      summary: Menambahkan kategori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Kategori berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Categories]
      summary: Mengambil detail kategori
      responses:
        '200':
          description: Detail kategori ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Memperbarui kategori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Kategori berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Categories]
      summary: Menghapus kategori
      responses:
        '204':
          description: Kategori berhasil dihapus
        '404':
          $ref: '#/components/responses/NotFound'

components:
  responses:
    BadRequest:
      description: Body request bukan JSON object yang valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ProductInput:
      type: object
      required: [category_id, name, price, stock]
      properties:
        category_id:
          type: integer
          minimum: 1
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Keyboard Mechanical
        price:
          type: number
          minimum: 0
          example: 450000
        stock:
          type: integer
          minimum: 0
          example: 15

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              example: 4
            created_at:
              type: string
              example: '2026-11-18 10:21:43'
            updated_at:
              type: string
              example: '2026-11-18 10:21:43'

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Peralatan Komputer
        description:
          type: [string, 'null']
          example: Aksesoris komputer

    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              example: 3
            created_at:
              type: string
              example: '2026-11-18 10:21:43'
            updated_at:
              type: string
              example: '2026-11-18 10:21:43'

    ProductResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Product'

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    CategoryResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Category'

    CategoryListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Harga harus berupa angka nonnegatif